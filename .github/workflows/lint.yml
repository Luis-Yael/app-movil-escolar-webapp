name: lint (isolated)

on:
  pull_request:
  push:
    branches:
      - eslint/compat-fix

jobs:
  isolated-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run isolated ESLint (pinned)
        run: npm run lint:isolated
